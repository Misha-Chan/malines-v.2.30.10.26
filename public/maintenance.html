<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Malines — صيانة</title>
    <meta name="description" content="مالينس قيد الصيانة. نعود قريباً." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Chakra+Petch:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --surface: #0d0d0d;
        --red: #c0392b;
        --gold: #d4af37;
        --paper: #e8e2d6;
        --muted: #b9b2a4;
        --faint: #6f6a60;
        --line: rgba(212, 175, 55, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(900px 520px at 50% -10%, rgba(192, 57, 43, 0.12), transparent 65%),
          radial-gradient(700px 480px at 85% 110%, rgba(212, 175, 55, 0.07), transparent 60%),
          var(--bg);
        color: var(--paper);
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(232, 226, 214, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 226, 214, 0.045) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
        opacity: 0.55;
      }

      .card {
        position: relative;
        width: min(92vw, 580px);
        padding: clamp(30px, 6vw, 58px) clamp(22px, 5vw, 52px);
        text-align: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008));
        border: 1px solid var(--line);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(6px);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: -1px -1px auto;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--red) 30%, var(--gold) 70%, transparent);
        opacity: 0.9;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--paper);
        font-family: "Chakra Petch", "Cairo", sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .brand svg {
        width: 24px;
        height: 28px;
        flex: none;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 30px 0 14px;
        color: var(--gold);
        font-family: "Chakra Petch", "Cairo", sans-serif;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 50px);
        font-weight: 800;
        line-height: 1.28;
        letter-spacing: -0.01em;
        color: var(--paper);
      }

      .lede {
        max-width: 40ch;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(14px, 2.4vw, 16.5px);
        font-weight: 300;
        line-height: 1.95;
      }

      .rule {
        width: 54px;
        height: 2px;
        margin: 30px auto 22px;
        background: linear-gradient(90deg, var(--red), var(--gold));
      }

      .meta {
        margin: 0;
        color: var(--faint);
        font-family: "Chakra Petch", "Cairo", sans-serif;
        font-size: 9.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      ::selection {
        background: rgba(192, 57, 43, 0.45);
        color: #fff;
      }

      @media (max-width: 420px) {
        .grid {
          background-size: 54px 54px;
        }

        .kicker {
          margin-top: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="grid" aria-hidden="true"></div>

    <main class="card">
      <div class="brand" aria-label="Malines Community">
        <svg viewBox="0 0 32 36" fill="none" aria-hidden="true">
          <path
            d="M16 1.6 29.8 6.5v11.9c0 8-5.6 13.6-13.8 16.4C7.8 32 2.2 26.4 2.2 18.4V6.5L16 1.6Z"
            stroke="currentColor"
            stroke-width="1.3"
          />
          <path
            d="M9.6 23.2V12.4L16 19.6l6.4-7.2v10.8"
            stroke="#c0392b"
            stroke-width="1.9"
            stroke-linejoin="round"
            stroke-linecap="square"
          />
        </svg>
        <span>Malines</span>
      </div>

      <p class="kicker"><span class="dot" aria-hidden="true"></span> Maintenance</p>

      <h1>الموقع تحت الصيانة</h1>

      <p class="lede">
        نُجري تحديثاً على الأنظمة الأساسية، ونُجهّز أدوات إدارة اللعبة.
        سنعود قريباً.
      </p>

      <div class="rule" aria-hidden="true"></div>

      <p class="meta" dir="ltr">Malines Community · 2026</p>
    </main>
  </body>
</html>
